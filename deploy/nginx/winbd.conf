# Host-level Nginx reverse proxy for winbd.vindover.ru.
# Copy to /etc/nginx/sites-available/winbd.conf on the VPS, symlink into
# sites-enabled, then run `certbot --nginx -d winbd.vindover.ru --redirect`
# to obtain a certificate — certbot rewrites this file to add the TLS
# server block and the http->https redirect automatically.
#
# Everything is forwarded to the frontend container (published on
# 127.0.0.1:8080 only). The frontend's own nginx.conf already proxies
# /api/, /socket.io/ and /uploads/ to the backend container over the
# docker network, so this host config stays a single generic proxy.

server {
    listen 80;
    server_name winbd.vindover.ru;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Socket.io), forwarded through to the backend
        # by the frontend container's own nginx.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
